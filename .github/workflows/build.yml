name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/outputs/apk/debug/*.apk calwidget.apk
          gh release create "v$GITHUB_RUN_NUMBER" calwidget.apk --target "$GITHUB_SHA" \
            --title "Widget calendrier v$GITHUB_RUN_NUMBER" --notes "Télécharge calwidget.apk et ouvre-le sur le téléphone."
